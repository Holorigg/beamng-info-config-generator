name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -c "import ast, os; tree = ast.parse(open('about.py', encoding='utf-8').read()); version = next(n.value.value for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'APP_VERSION' for t in n.targets)); expected = os.environ['RELEASE_TAG'][1:]; assert version == expected, 'tag ' + os.environ['RELEASE_TAG'] + ' does not match APP_VERSION ' + version"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build and smoke-test executable
        run: python build_windows.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: beamng-infogen-windows
          path: |
            dist/beamng-infogen.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: beamng-infogen-windows
          path: dist
      - name: Create draft release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            dist/beamng-infogen.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body_path: docs/releases/${{ github.ref_name }}.md
          draft: true
          generate_release_notes: false
